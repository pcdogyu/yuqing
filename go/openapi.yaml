openapi: 3.1.0
info:
  title: 简苏舆情 Go Portal API
  version: 0.1.0
  description: Go 重构版舆情门户开放接口说明。
servers:
  - url: http://127.0.0.1:8081
paths:
  /api/v1/auth/login:
    post:
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
  /api/v1/auth/session:
    get:
      summary: 校验会话
      parameters:
        - in: query
          name: session_token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 会话有效
  /api/v1/projects:
    get:
      summary: 项目列表
      responses:
        '200': { description: 项目列表 }
    post:
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                keywords: { type: string }
                description: { type: string }
      responses:
        '200': { description: 创建成功 }
  /api/v1/articles:
    get:
      summary: 文章列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: source_type
          schema: { type: string, enum: [flash, headline, jin10_full, eastmoney_kuaixun, crypto_x, crypto_telegram, foresight_newsflash, coindesk_zh_latest, panews_newsflash] }
      responses:
        '200': { description: 文章列表 }
  /api/v1/search/articles:
    get:
      summary: FTS 搜索
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: 搜索结果 }
  /api/v1/crypto/pairs/resolve:
    get:
      summary: 解析币对输入
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: 解析结果 }
  /api/v1/crypto/news:
    get:
      summary: 查询币对相关新闻
      parameters:
        - in: query
          name: pair
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: 相关新闻列表 }
  /api/v1/crypto/social:
    get:
      summary: 查询币对社媒证据
      parameters:
        - in: query
          name: pair
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: 社媒证据列表 }
  /api/v1/analysis/overview:
    get:
      summary: 总览分析
      responses:
        '200': { description: 分析结果 }
  /api/v1/crypto/insights:
    get:
      summary: 币对走势洞察
      parameters:
        - in: query
          name: pair
          required: true
          schema: { type: string }
      responses:
        '200': { description: 洞察结果 }
  /api/v1/reports:
    get:
      summary: 报告列表
      responses:
        '200': { description: 报告列表 }
  /api/v1/reports/generate:
    post:
      summary: 生成报告
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: { type: integer }
                title: { type: string }
                text: { type: string }
      responses:
        '200': { description: 生成成功 }
  /api/v1/admin/tasks/crawl:
    post:
      summary: 手动触发采集
        parameters:
          - in: query
            name: source_type
            schema: { type: string, enum: [flash, headline, jin10_full, eastmoney_kuaixun, crypto_x, crypto_telegram, foresight_newsflash, coindesk_zh_latest, panews_newsflash] }
        responses:
          '200': { description: 触发成功 }
